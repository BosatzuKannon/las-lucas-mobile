name: Deploy to Google Play (Internal)

on:
  push:
    branches:
      - main 
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    # Descomenta y ajusta estas variables de entorno si tu app las necesita para compilar
    # env:
    #   EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
    #   EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
    #   EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install Dependencies
        run: npm install

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Expo Prebuild
        run: npx expo prebuild --platform android --clean

      - name: Decode Keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d -i > android/app/keystore.jks

      - name: Build Android App Bundle (.aab)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          cd android
          ./gradlew bundleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/app/keystore.jks \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD

      - name: Create Google Play Config JSON
        run: echo '${{ secrets.PLAY_STORE_CONFIG_JSON }}' > google-play.json

      - name: Setup Ruby for Fastlane
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true

      - name: Fastlane - Upload to Google Play
        run: |
          gem install fastlane
          fastlane run upload_to_play_store \
            track:internal \
            aab:android/app/build/outputs/bundle/release/app-release.aab \
            mapping:android/app/build/outputs/mapping/release/mapping.txt \
            json_key:google-play.json \
            package_name:com.bosatzu.laslucasmobile \
            skip_upload_metadata:true \
            skip_upload_images:true \
            skip_upload_screenshots:true

      - name: Save ProGuard Mapping Artifact
        uses: actions/upload-artifact@v4
        with:
          name: proguard-mapping
          path: android/app/build/outputs/mapping/release/mapping.txt
          retention-days: 30